; Input is Enhanced Input, with the actions and the mapping context created in C++ (AMIPlayerController).
; The look code applies degrees per mouse count itself, so no engine-side scaling or smoothing may sit in between.
[/Script/Engine.InputSettings]
bEnableMouseSmoothing=False
bEnableFOVScaling=False
bEnableLegacyInputScales=False
bCaptureMouseOnLaunch=True
DefaultViewportMouseCaptureMode=CapturePermanently_IncludingInitialMouseDown
DefaultViewportMouseLockMode=LockOnCapture
DefaultPlayerInputClass=/Script/EnhancedInput.EnhancedPlayerInput
DefaultInputComponentClass=/Script/EnhancedInput.EnhancedInputComponent
DefaultTouchInterface=None

; The engine's BaseInput.ini scales every mouse axis by 0.07 (AxisConfig Sensitivity), and Enhanced Input applies it
; to Mouse2D even with the legacy input scales off: mouse look turned 14 times slower than player.input.mouse says
; (measured in the packaged game on the box: 300 counts gave 2.5 degrees instead of 36). Replace the three entries.
-AxisConfig=(AxisKeyName="MouseX",AxisProperties=(DeadZone=0.f,Exponent=1.f,Sensitivity=0.07f))
-AxisConfig=(AxisKeyName="MouseY",AxisProperties=(DeadZone=0.f,Exponent=1.f,Sensitivity=0.07f))
-AxisConfig=(AxisKeyName="Mouse2D",AxisProperties=(DeadZone=0.f,Exponent=1.f,Sensitivity=0.07f))
+AxisConfig=(AxisKeyName="MouseX",AxisProperties=(DeadZone=0.f,Exponent=1.f,Sensitivity=1.f))
+AxisConfig=(AxisKeyName="MouseY",AxisProperties=(DeadZone=0.f,Exponent=1.f,Sensitivity=1.f))
+AxisConfig=(AxisKeyName="Mouse2D",AxisProperties=(DeadZone=0.f,Exponent=1.f,Sensitivity=1.f))

; Unreal 5.9 ships an input device mapping policy for Windows, Mac, Android and iOS but none for Linux. Without one,
; the first gamepad that connects raises an "ensure" (an error with a call stack in the log of a Development game,
; seen on the box when a pad joined through the stream) before the engine falls back to this same policy:
; 1 = the first player uses the keyboard, the mouse and the first gamepad.
[InputPlatformSettings_Linux InputPlatformSettings]
input.DeviceMappingPolicy=1
