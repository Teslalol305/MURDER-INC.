; Sound (docs/unreal/AUDIO.md section 9; the review of version 3b, docs/unreal/sound_review_3b.json).
;
; Channels. The engine's audio device has 32 voices by default (FAudioQualitySettings::MaxChannels). Past that it ranks
; every voice by loudness x priority, keeps the highest and stops the rest, and a stopped loop that comes back starts
; from its first sample: in a magazine dump (49 to 88 sound starts a second, 72 one-shot voices alive at once) the music's
; stems, ducked to 0.02 to 0.13, lost their voices and each came back from the top of its loop at its own moment, the bass
; 0.2 s and the hats 0.3 s behind the drums for the rest of the session. The web game's bus pools add up to 89 voices
; (audio.json categories.voices); 96 leaves room above them. The log then says "Max Channels (voices): 96" and
; "AudioDevice MaxSources: 96".
;
; Mono 2D sounds. The engine upmixes a mono source to the front pair at 0.5 + 0.5 by default (Linear): every mono sound
; arrived 4.5 to 6.5 dB under its volume x category gain, while the stereo street bed arrived 2.5 dB under, and the
; master chain (compressor at -6 dB) was driven 6 dB less than it was built for. The web game plays a mono buffer whole
; in both channels (FullVolume) and pans a 3D sound with equal power (PanningMethod EqualPower).
[/Script/Engine.AudioSettings]
+QualityLevels=(DisplayName=NSLOCTEXT("AudioSettings","DefaultSettingsName","Default"),MaxChannels=96)
MonoChannelUpmixMethod=FullVolume
PanningMethod=EqualPower
