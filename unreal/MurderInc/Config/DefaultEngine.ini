; Rendering target: Lumen global illumination and reflections, Nanite, virtual shadow maps, hardware ray tracing,
; temporal super resolution. Every key is a config console variable of URendererSettings (Engine/RendererSettings.h).
; Linux: the Vulkan SM6 shader platform declares all of them (Engine/Config/VulkanPC/DataDrivenPlatformInfo.ini,
; [ShaderPlatform VULKAN_SM6]: bSupportsRayTracing, bSupportsInlineRayTracing, bSupportsPathTracing, bSupportsNanite,
; bSupportsLumenGI, bSupportsGen5TemporalAA). Vulkan SM5 has no Nanite and no Lumen, so SM5 is not targeted.
[/Script/Engine.RendererSettings]
r.DynamicGlobalIlluminationMethod=1
r.ReflectionMethod=1
r.GenerateMeshDistanceFields=True
r.AllowStaticLighting=False
r.Shadow.Virtual.Enable=1
r.Nanite.ProjectEnabled=True
r.RayTracing=True
r.RayTracing.Shadows=False
r.SkinCache.CompileShaders=True
r.Lumen.HardwareRayTracing=True
r.Lumen.TraceMeshSDFs=0
r.AntiAliasingMethod=4
r.DefaultFeature.AutoExposure.ExtendDefaultLuminanceRange=True

[/Script/LinuxTargetPlatform.LinuxTargetSettings]
-TargetedRHIs=SF_VULKAN_SM5
+TargetedRHIs=SF_VULKAN_SM6
RayTracingMode=Full

[/Script/WindowsTargetPlatform.WindowsTargetSettings]
DefaultGraphicsRHI=DefaultGraphicsRHI_DX12
-D3D12TargetedShaderFormats=PCD3D_SM5
+D3D12TargetedShaderFormats=PCD3D_SM6

; Physically based daylight (sun about 100,000 lx, exposure EV100 13 to 14.5) is above the default cached-lighting
; range ([-8, 12] EV at the default 4): Lumen's cached lighting and the real-time sky capture would clip, and the
; editor says so on screen. 8 covers [-4, 16] (Renderer/Private/PostProcess/PostProcessEyeAdaptation.cpp).
[SystemSettings]
r.EyeAdaptation.CachedLightingPreExposure=8

; The bundled pipeline cache (docs/unreal/SMOOTH.md H3, H4): a fresh E3DS machine has no driver shader cache, and the
; engine's PSO precaching covers materials only as they load, so the first title, home and Crew frames and the first
; fight created pipeline states at draw time (110 to 260 ms frames, trains of 33 ms frames). The package carries a
; cache recorded through the front end, the Story, the holdout, every gun and optic, deaths and blasts
; (Build/Linux/PipelineCaches/, made by tools/box/cloud/pso-cache.sh; the cook turns it into
; Content/PipelineCaches/Linux/MurderInc_SF_VULKAN_SM5.stable.upipelinecache). Unreal compiles it from the first frame,
; on the precaching threads, while the title waits for its viewer. Both lines are read before the graphics device starts:
; - Vulkan turns the file cache off when PSO precaching is on (VulkanRHI.cpp): this keeps both.
; - every recorded PSO is compiled, also those the recording run had precached in time (default 2 skips them; on a
;   slower 8-thread host the precacher is later, so the cache would miss exactly what a cold start misses).
; The editor never opens a pipeline cache (it has no shader code library), so neither line changes the editor or the tests.
[ConsoleVariables]
r.Vulkan.EnablePSOFileCacheWhenPrecachingActive=1
r.ShaderPipelineCache.PSOPrecacheIncludeMode=0

; The cook writes the stable shader keys (Saved/Cooked/Linux/MurderInc/Metadata/PipelineCaches/) that turn a
; recording of PSOs into a cache the next cook can bundle (tools/box/cloud/pso-cache.sh expand).
[DevOptions.Shaders]
NeedsShaderStableKeys=true

; The weapon trace channel (spec 01 4.4, spec 02 4.4): ECC_GameTraceChannel1 "Bullet". World geometry blocks it by
; default; "player-only" blockers ignore it; the player capsule ignores it; enemy and dummy hit shapes answer only to it.
[/Script/Engine.CollisionProfile]
+DefaultChannelResponses=(Channel=ECC_GameTraceChannel1,DefaultResponse=ECR_Block,bTraceType=True,bStaticObject=False,Name="Bullet")
