[/Script/EngineSettings.GameMapsSettings]
EditorStartupMap=/Game/Maps/L_Bootstrap.L_Bootstrap
GameDefaultMap=/Game/Maps/L_Bootstrap.L_Bootstrap
ServerDefaultMap=/Engine/Maps/Entry
GlobalDefaultGameMode=/Script/MurderInc.MIGameMode
GameInstanceClass=/Script/Engine.GameInstance
bUseSplitscreen=False

; Rendering target: Lumen global illumination and reflections, Nanite, virtual shadow maps, hardware ray tracing,
; temporal super resolution. Every key is a config console variable of URendererSettings (Engine/RendererSettings.h).
; Linux: the Vulkan SM6 shader platform declares all of them (Engine/Config/VulkanPC/DataDrivenPlatformInfo.ini,
; [ShaderPlatform VULKAN_SM6]: bSupportsRayTracing, bSupportsInlineRayTracing, bSupportsPathTracing, bSupportsNanite,
; bSupportsLumenGI, bSupportsGen5TemporalAA). Vulkan SM5 has no Nanite and no Lumen, so SM5 is not targeted.
[/Script/Engine.RendererSettings]
r.DynamicGlobalIlluminationMethod=1
r.ReflectionMethod=1
r.GenerateMeshDistanceFields=True
r.AllowStaticLighting=False
r.Shadow.Virtual.Enable=1
r.Nanite.ProjectEnabled=True
r.RayTracing=True
r.RayTracing.Shadows=False
r.SkinCache.CompileShaders=True
r.Lumen.HardwareRayTracing=True
r.Lumen.TraceMeshSDFs=0
r.AntiAliasingMethod=4
r.DefaultFeature.AutoExposure.ExtendDefaultLuminanceRange=True

[/Script/LinuxTargetPlatform.LinuxTargetSettings]
-TargetedRHIs=SF_VULKAN_SM5
+TargetedRHIs=SF_VULKAN_SM6
RayTracingMode=Full

[/Script/WindowsTargetPlatform.WindowsTargetSettings]
DefaultGraphicsRHI=DefaultGraphicsRHI_DX12
-D3D12TargetedShaderFormats=PCD3D_SM5
+D3D12TargetedShaderFormats=PCD3D_SM6

; Physically based daylight (sun about 100,000 lx, exposure EV100 13 to 14.5) is above the default cached-lighting
; range ([-8, 12] EV at the default 4): Lumen's cached lighting and the real-time sky capture would clip, and the
; editor says so on screen. 8 covers [-4, 16] (Renderer/Private/PostProcess/PostProcessEyeAdaptation.cpp).
[SystemSettings]
r.EyeAdaptation.CachedLightingPreExposure=8
