[/Script/EngineSettings.GeneralProjectSettings]
ProjectID=4D494E43313939340000000000000001
ProjectName=MURDER INC.
ProjectVersion=0.1.0
Description=First-person shooter. Rebuilt from the web game.

; Content/Data/*.json is read with the file system at start-up (UMIDataSubsystem), so it ships as loose files.
[/Script/UnrealEd.ProjectPackagingSettings]
+DirectoriesToAlwaysStageAsNonUFS=(Path="Data")

; The maps that run the game (UMIGameSubsystem::Boot from AMIGameMode::StartPlay): the art map and the grey box
; (an empty map: the block is built from level.json at run time). Any map takes ?block=1 to boot as well.
[/Script/MurderInc.MIGameMode]
+BlockMaps=L_Block
+BlockMaps=L_GreyBlock

; The 'Cloud' scalability profile (Source/MurderInc/Cloud/MICloud.cpp): set at start, with device-profile priority,
; only when the game runs under Pixel Streaming (or with -MICloud). Budget: under 7 GB of video memory at 1080p and
; 60 fps on an 8 GB RTX 4080-class server GPU (docs/LAUNCH.md, measurements in docs/unreal/PROGRESS.md).
; 2026-11-24 (E3DS crash fix): the game must also start with only 5 GB of the card free (another process holding
; memory, a smaller card): measured with tools/box/cloud/vram_hog.py, the pool and the TSR history below are what it
; took (the package also stores the six interior cube maps as BC6H: tools/box/cloud/cloud_assets.py).
[MICloud]
; Texture streaming pool (MB): the Epic preset's 1000; 600 leaves room on an 8 GB card with something else on it.
+CVars=r.Streaming.PoolSize=600
+CVars=r.Streaming.LimitPoolSizeToVRAM=1
; Nanite streaming pool (MB; 512 by default) and virtual shadow map physical pages (4096 by default, 64 KB each).
+CVars=r.Nanite.Streaming.StreamingPoolSize=256
+CVars=r.Shadow.Virtual.MaxPhysicalPages=2048
; Lumen: half-resolution reflections, glossy reflections only up to roughness 0.4.
+CVars=r.Lumen.Reflections.DownsampleFactor=2
+CVars=r.Lumen.Reflections.MaxRoughnessToTrace=0.4
; Temporal super resolution keeps its history at the output resolution (the Epic preset keeps 200 %: a 4K history,
; about 180 MB more at 1080p, invisible once the H.264 stream has compressed the picture).
+CVars=r.TSR.History.ScreenPercentage=100
; The stream is 60 fps: render no more; motion blur costs encoder bits for little.
+CVars=t.MaxFPS=60
+CVars=r.VSync=0
+CVars=r.MotionBlurQuality=0
